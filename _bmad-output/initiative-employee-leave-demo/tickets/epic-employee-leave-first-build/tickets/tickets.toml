[[entry]]
id = 6
type = "story"
title = "Integrate frontend and backend and verify journeys"
description = "Verify the Employee and Manager journeys across the locally running Compose stack, including direct backend authorization and browser accessibility checks with run-scoped fixtures in an isolated Playwright container."
verify = "Start and health-check application Compose services separately; run ./scripts/run-local-e2e.sh to pipe tracked scripts/e2e/fixtures.sql and cleanup.sql into psql in the PostgreSQL container with POSTGRES_DB, POSTGRES_USER, a run marker, and ON_ERROR_STOP; mount the manifest and ignored credentials into the one-shot E2E service on the app network, run proxy and direct backend checks plus Playwright with valid session/CSRF for protected POSTs, remove only the E2E runner, and clean only run fixtures on success or failure."
covers = ["R1", "R2", "R3", "R4", "R5", "R6", "R7"]
after = [5]
hitl = false
risk = "high"
refine = true
