id = 5
type = "story"
title = "Build Manager review and decisions"
description = "The signed-in Manager sees requests from assigned Employees and can decide a Pending request once as Approved or Rejected."
verify = "List, retrieve, approve, reject, and repeat decisions through the Manager surface and direct API calls, including assignment-denial cases."
