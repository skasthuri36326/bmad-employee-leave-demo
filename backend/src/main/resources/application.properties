spring.application.name=employee-leave-api
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/employee_leave_demo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:leave_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.initialization-fail-timeout=0
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.name=LEAVESESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
spring.mvc.problemdetails.enabled=true
logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
